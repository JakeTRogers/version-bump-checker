name: Release

"on":
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        shell: bash
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::$TAG isn't a vX.Y.Z[-prerelease] tag"; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/main ||
            { echo "::error::$TAG isn't on main"; exit 1; }

      - name: Extract release notes
        shell: bash
        run: |
          # The CHANGELOG.md section whose heading is "## $TAG" or "## $TAG (date)".
          awk -v tag="$TAG" '/^## / { if (found) exit; found = ($2 == tag); next } found' \
            CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" ||
            { echo "::error::CHANGELOG.md has no entry for $TAG"; exit 1; }
          cat "$RUNNER_TEMP/notes.md"

      - name: Create or update the release
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            flags=()
            [[ $TAG != *-* ]] || flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi

      - name: Move the major version tag
        shell: bash
        run: |
          major=${TAG%%.*}
          if [[ $TAG == *-* ]]; then
            echo "Prerelease: $major stays where it is"
            exit 0
          fi
          # awk reads all input (no early exit), so git never gets SIGPIPE under pipefail.
          newest=$(git tag --list "$major.*" --sort=-v:refname |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found++')
          if [[ $newest != "$TAG" ]]; then
            echo "$newest is newer than $TAG: $major stays where it is"
            exit 0
          fi
          sha=$(git rev-parse "$TAG^{commit}")
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
              -f sha="$sha" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major" -f sha="$sha" >/dev/null
          fi
          echo "### Moved $major to $TAG (${sha:0:7})" >>"$GITHUB_STEP_SUMMARY"
